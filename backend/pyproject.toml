[project]
name = "resume-crafter"
version = "0.1.0"
description = "Multi-user resume crafting system with intelligent job matching"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.0",
    # Structured LLM Outputs (Ollama via OpenAI-compatible API)
    "instructor>=1.0.0",
    "openai>=1.0.0",
    "tenacity>=8.2.0",
    # Document Processing
    "pdfplumber>=0.10.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.12.0",
    "httpx>=0.26.0",
    # ML & Vectors
    "chromadb>=0.4.0",
    "sentence-transformers>=2.3.0",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0", # bcrypt 5.x has breaking changes with passlib
    # Background Tasks
    "arq>=0.26.0",
    # Rate Limiting
    "slowapi>=0.1.9",
    # Utils
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "respx>=0.20.0",
    "factory-boy>=3.3.0",
    "freezegun>=1.4.0",
    "testcontainers[postgres]>=3.7.0",
    "hypothesis>=6.100.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "aiosqlite>=0.20.0",
]

scraping = [
    "playwright>=1.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
